[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:mlflow]
command=/bin/sh -c "mkdir -p /app/storage/mlartifacts && exec mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri sqlite:////app/storage/mlflow.db --default-artifact-root /app/storage/mlartifacts"
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:streamlit]
command=/bin/bash /app/start_streamlit.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
